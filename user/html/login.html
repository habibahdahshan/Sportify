<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Sportify</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Anton&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/shop.css">
</head>
<body>
  <nav class="navbar">
    <a href="../../home.html" class="logo">Sportify</a>
    <ul>
      <li><a href="../../home.html">Home</a></li>
      <li><a href="aboutus.html">About us</a></li>
      <li><a href="contactus.html">Contact</a></li>
      <li><a href="signup.html">Sign up</a></li>
    </ul>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Sign in</h1>
      <p>Use the same email and password you chose at registration (stored locally in your browser for this demo).</p>
      <form id="loginForm" novalidate>
        <label for="email">Email</label>
       <input type="email" id="email" name="email" required autocomplete="email" placeholder="example@gmail.com">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters">
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password">Show</button>
        </div>
        <button type="submit">Sign in</button>
      </form>
      <p id="authMsg" class="auth-msg" role="status"></p>
      <p class="auth-alt">Don't have an account? <a href="signup.html">Sign up</a></p>
      <p class="auth-alt"><a href="../../Admin/Html/admin.html">Staff dashboard</a></p>
    </div>
  </main>
  <script src="../Js/site-ui.js"></script>

  <script src="../Js/auth.js"></script>
</body>
</html>
