<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account · Sportify</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Anton&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/shop.css">
</head>
<body>
  <nav class="navbar">
    <a href="../../home.html" class="logo">Sportify</a>
    <ul>
      <li><a href="../../home.html">Home</a></li>
      <li><a href="aboutus.html">About us</a></li>
      <li><a href="contactus.html">Contact</a></li>
      <li><a href="login.html">Sign in</a></li>
    </ul>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create account</h1>
      <p>We keep this demo simple: your profile is saved only in this browser.</p>
      <form id="signupForm" novalidate>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" required autocomplete="new-password" minlength="4">
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password">Show</button>
        </div>
        <button type="submit">Sign up</button>
      </form>
      <p id="authMsg" class="auth-msg" role="status"></p>
      <p class="auth-alt">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>
  <script src="../Js/site-ui.js"></script>

  <script src="../Js/auth.js"></script>
</body>
</html>
